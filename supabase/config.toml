# Project ref is read from the environment (SUPABASE_PROJECT_ID in .env), never hard-coded —
# so dev/prod is chosen by env, not baked into the repo. Supabase CLI resolves env(...) at runtime.
project_id = "env(SUPABASE_PROJECT_ID)"

# BANKSapi redirects the customer's BROWSER here after the REG/Protect webform, with no
# JWT attached, so this one function must accept unauthenticated requests. It only ever
# updates a bank_connections row we created ourselves in bank-connect.
[functions.bank-callback]
verify_jwt = false

# Same reasoning as bank-callback: BANKSapi's payment-SCA webform redirects the customer's
# BROWSER here with no JWT attached. payment-callback never trusts the query string for the
# outcome itself, only to look up which row to re-check with BANKSapi directly.
[functions.payment-callback]
verify_jwt = false

# Propstack posts here with no JWT attached. Unlike the two callbacks above this can insert a
# brand-new property, so it checks X-Propstack-Signature against PROPSTACK_WEBHOOK_SECRET instead
# of relying on a narrower trust model.
[functions.propstack-webhook]
verify_jwt = false
